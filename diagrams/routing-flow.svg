  <text x="520" y="626" font-size="15" font-weight="bold" fill="#1B2A4A">Verify evidence · 验证存证</text>
  <text x="520" y="650" font-size="13" fill="#3A5A8C">→ evaluation-evidence（hash-manifest）</text>
