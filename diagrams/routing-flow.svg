  <text x="700" y="728" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Three pillars, one standard: neutral, evidence-based, verifiable / 三权分立：中立 · 证据 · 可验证</text>
  <text x="700" y="748" text-anchor="middle" font-size="12" fill="#E8D9A0">Rule: map your intent first — do not stay here for work that belongs to another pillar / 规则：先对照意图——不属于本号的工作请直接跳转</text>
  <text x="700" y="810" text-anchor="middle" font-size="12" fill="#7A879B">LGD-Eval · Evaluating Autonomy, Verifying Governance / 评测自治之物，验证治理主张</text>
