name: unit-tests

# 本地契约门禁（阶段1 + P0-2 分轨骨架）：
#   - tests/test_scorecard_contract.py：评分卡纯函数契约（unittest；依赖缺失则 SKIP，不伪装通过）
#   - tests/test_copy_parity.py：skills/lgd-eval/scripts ↔ vendor/scripts 双副本逐字节守门；
#     未登记的新分叉/单侧缺失即 FAIL（exit 1），已登记分叉见 tests/known_divergence.txt。
#   - unittest discover：授权状态机 / 证据链 / MCP 作用域 / gold 夹具结构 / 端到端分轨桩。
# 授权状态机为骨架期：无独立决策方一律 NOT_GRANTED；gold 阈值未标定，占位对照不计真实准确性达标。
# Python 版本：先用 3.11（与 scanner-gate 对齐；纯标准库，无第三方依赖）。
# 3.10/3.12/3.13 矩阵待依赖锁定、干净环境复跑通过后再扩。

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scorecard contract
        run: python tests/test_scorecard_contract.py

      - name: Vendor copy parity gate
        run: python tests/test_copy_parity.py

      - name: P0 separation & evidence stubs
        run: python -m unittest discover -s tests
