name: tests

# CI-1 / CI-2 修复：把真实 pytest、vendor 逐字节 parity、评测器自身准确性基准
# 纳入流水线实跑；此前三者都只在作者本机（E1）执行，CI 不跑、不卡 PR。
# 本工作流为 stdlib-only + pytest；不安装可选第三方依赖。
# 触发：PR、push main、手动。PR 必须跑（auto-eval 此前仅 push main / 定时 / 手动）。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run pytest
        run: python -m pytest tests -q

  parity:
    name: vendor script byte-for-byte parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify skills/.../scripts == vendor/scripts
        # 独立 main()，不被 pytest 收集；必须显式调用，非零退出即失败。
        run: python tests/test_copy_parity.py

  benchmark:
    name: evaluator self-accuracy benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run labeled-sample benchmark (17 cases)
        # 与标注期望不符即退出 1；防止评测器越调越自洽却与真实对错脱节。
        run: python skills/lgd-eval/scripts/accuracy_benchmark.py
