  <text x="700" y="74" text-anchor="middle" font-size="16" fill="#3A5A8C">For every pain an AI owner has, a clear path today and a credible future / 每一个痛点：今天有清晰路径，未来有可信前景</text>
  <line x1="120" y1="92" x2="1280" y2="92" stroke="#C9A227" stroke-width="3"/>
  <!-- column headers -->
  <rect x="60" y="110" width="420" height="44" rx="10" fill="#8C3A3A"/>
  <text x="270" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Pain · 痛点</text>
  <rect x="490" y="110" width="420" height="44" rx="10" fill="#1B2A4A"/>
  <text x="700" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">Immediate Path · 立即路径</text>
  <rect x="920" y="110" width="420" height="44" rx="10" fill="#C9A227"/>
  <text x="1130" y="138" text-anchor="middle" font-size="18" font-weight="bold" fill="#1B2A4A">Future · 未来</text>
  <!-- row 1 -->
  <rect x="60" y="164" width="420" height="108" rx="10" fill="#FBF1F0" stroke="#8C3A3A" stroke-width="1.5"/>
  <text x="80" y="192" font-size="15" font-weight="bold" fill="#8C3A3A">My AI gets tricked by malicious skills · 技能投毒</text>
  <text x="80" y="218" font-size="12" fill="#5A6B82">被恶意技能欺骗 / 供应链攻击风险</text>
  <text x="80" y="248" font-size="12" fill="#8C3A3A">→ skill-audit：scanner.py 检测 + 提交可疑样本</text>
  <rect x="490" y="164" width="420" height="108" rx="10" fill="#EAF0F9" stroke="#1B2A4A" stroke-width="1.5"/>
  <text x="510" y="192" font-size="14" font-weight="bold" fill="#1B2A4A">Run scanner / 跑扫描器</text>
  <text x="510" y="218" font-size="12" fill="#5A6B82">https://github.com/LGD-Eval/skill-audit</text>
  <text x="510" y="244" font-size="12" fill="#5A6B82">manifest / prompt 投毒检测 · 风险分级</text>
  <rect x="920" y="164" width="420" height="108" rx="10" fill="#F7EFDC" stroke="#C9A227" stroke-width="1.5"/>
  <text x="940" y="192" font-size="14" font-weight="bold" fill="#1B2A4A">Skill supply-chain audit standard</text>
  <text x="940" y="218" font-size="12" fill="#5A6B82">技能供应链审计标准</text>
  <text x="940" y="244" font-size="12" fill="#5A6B82">AI 加载前自动验签 · 全生态可信分级</text>
  <!-- row 2 -->
  <rect x="60" y="282" width="420" height="108" rx="10" fill="#FBF1F0" stroke="#8C3A3A" stroke-width="1.5"/>
  <text x="80" y="310" font-size="15" font-weight="bold" fill="#8C3A3A">No neutral third-party validation · 无中立验收</text>
  <text x="80" y="336" font-size="12" fill="#5A6B82">我的 AI 工具链没人中立测试过</text>
  <text x="80" y="366" font-size="12" fill="#8C3A3A">→ evaluation-protocol：L0-L13 实测</text>
  <rect x="490" y="282" width="420" height="108" rx="10" fill="#EAF0F9" stroke="#1B2A4A" stroke-width="1.5"/>
