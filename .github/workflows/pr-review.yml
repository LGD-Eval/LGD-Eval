# ============================================================
# PR REVIEW BOT — 审核机器人（LGD-Eval）
# Automatic review on every pull request:
#   mojibake scan · key-file completeness · size limits ·
#   bilingual-terminology check · link check · structured comment
# workflow_dispatch: self-test mode (no PR needed) — verify the audit logic.
# 每个 PR 自动审核；手动触发可自检（不依赖 PR）。
# ============================================================
name: PR Review Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      self_test:
        description: "Run self-test of audit logic (no PR needed) / 自检审计逻辑"
        required: false
        default: "true"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Audit the PR (mojibake / completeness / size / terms / links)
        id: audit
        run: python3 .github/scripts/pr-audit.py
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          # NOTE: do not override GITHUB_OUTPUT here. The runner injects the real
          # path; pointing it at /tmp made steps.audit.outputs.result always empty,
          # so the bot reported "0 blocking / 0 warnings" no matter what the audit
          # found. The audit step itself still exits 1 on blocking errors (see
          # pr-audit.py main()), which is what the required check actually grades.

      - name: Post structured review comment
        if: always()
        # Courtesy step, not the gate. Fork PRs get a read-only GITHUB_TOKEN, so
        # this 403s ("Resource not accessible by integration") and used to fail
        # the whole required check even when the audit found nothing. The blocking
        # verdict belongs to the audit step above; a missing comment is reported
        # as a warning in the log, not as a red gate.
        continue-on-error: true
        env:
          AUDIT_JSON: ${{ steps.audit.outputs.result }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            let data = { errors: [], issues: [] };
            try { data = JSON.parse(process.env.AUDIT_JSON || '{}'); } catch (e) {}
            const body = [
              "## 🤖 LGD-Eval PR Review Bot",
              "",
              "**Blocking issues/阻断**: " + (data.errors || []).length + " — **Warnings/提示**: " + (data.issues || []).length,
              "",
              ...(data.errors || []).map(e => "- 🔴 " + e),
              ...(data.issues || []).map(i => "- 🟡 " + i),
              "",
              "> 审核机器人结论：乱码/编码类错误必须修复；提示类仅供人类评审参考。签发权始终在人。",
              "> Bot verdict: mojibake/encoding failures must be fixed; warnings are for human reviewers. Sign-off always stays with humans (签发权在人)。"
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            }).catch(e => {
              // Read-only token (fork PR) or comment permission not granted.
              // Print to the log instead of failing: the audit step already
              // produced the verdict, and a cosmetic post must not gate a merge.
              core.warning("Could not post review comment: " + e.message);
            });

  self-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run audit self-test
        run: python3 .github/scripts/pr-audit.py --self-test
