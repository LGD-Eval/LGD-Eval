<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="1400" height="900" fill="#F7F9FC"/>
  <!-- header -->
